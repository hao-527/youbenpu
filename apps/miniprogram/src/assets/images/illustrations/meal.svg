  <line x1="78" y1="32" x2="92" y2="80" stroke="#D4880A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="82" y1="32" x2="88" y2="80" stroke="#C9440A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Chopstick tips -->
  <circle cx="91" cy="79" r="1.5" fill="#D4880A"/>
  <circle cx="87.5" cy="79" r="1.5" fill="#C9440A"/>
