  <!-- Plate inner ring -->
  <ellipse cx="58" cy="70" rx="22" ry="12" fill="none" stroke="#FDDCB5" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Rice/food mound -->
  <ellipse cx="58" cy="64" rx="16" ry="10" fill="#FFE8A3"/>
  <path d="M42 64C42 58 50 54 58 54C66 54 74 58 74 64" fill="#FFD97A" stroke="#D4880A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Food topping (egg) -->
  <ellipse cx="56" cy="58" rx="7" ry="5" fill="#FFFFFF" stroke="#F5A86C" stroke-width="1.5"/>
  <circle cx="56" cy="57" r="3" fill="#FFD97A"/>
  <!-- Steam lines -->
  <path d="M48 44C48 42 50 40 50 38" stroke="#E8530E" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M58 42C58 40 60 38 60 36" stroke="#E8530E" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M68 44C68 42 70 40 70 38" stroke="#E8530E" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
