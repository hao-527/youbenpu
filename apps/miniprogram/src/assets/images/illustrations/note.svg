<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="52" fill="#FFF8F0"/>
  <!-- Notebook body -->
  <rect x="32" y="28" width="50" height="64" rx="6" fill="#FFFFFF" stroke="#E8530E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Notebook cover accent -->
  <rect x="32" y="28" width="50" height="16" rx="6" fill="#FDDCB5" stroke="#E8530E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Spiral binding dots -->
  <circle cx="38" cy="50" r="2.5" fill="#E8530E"/>
  <circle cx="38" cy="58" r="2.5" fill="#E8530E"/>
  <circle cx="38" cy="66" r="2.5" fill="#E8530E"/>
  <circle cx="38" cy="74" r="2.5" fill="#E8530E"/>
  <circle cx="38" cy="82" r="2.5" fill="#E8530E"/>
  <!-- Lines on page -->
  <line x1="45" y1="52" x2="74" y2="52" stroke="#F5D4B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="45" y1="60" x2="70" y2="60" stroke="#F5D4B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="45" y1="68" x2="72" y2="68" stroke="#F5D4B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="45" y1="76" x2="66" y2="76" stroke="#F5D4B8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pencil -->
  <g transform="rotate(-35, 82, 52)">
    <!-- Pencil body -->
    <rect x="74" y="30" width="8" height="44" rx="2" fill="#FFD97A" stroke="#D4880A" stroke-width="1.5"/>
    <!-- Pencil tip -->
    <polygon points="74,74 82,74 78,84" fill="#FDDCB5" stroke="#D4880A" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Pencil tip point -->
    <polygon points="76.5,78 79.5,78 78,84" fill="#4A3728"/>
    <!-- Pencil band -->
    <rect x="74" y="68" width="8" height="6" fill="#E8530E" opacity="0.8"/>
    <!-- Eraser -->
    <rect x="74" y="30" width="8" height="8" rx="2" fill="#F5A86C" stroke="#D4880A" stroke-width="1.5"/>
  </g>
  <!-- Decorative sparkle -->
  <path d="M90 80L92 76L94 80L92 84Z" fill="#E8530E" opacity="0.5"/>
</svg>
