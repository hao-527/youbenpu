<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="52" fill="#FFF8F0"/>
  <!-- Box body -->
  <rect x="30" y="48" width="54" height="36" rx="6" fill="#FDDCB5" stroke="#E8530E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Box lid -->
  <path d="M26 48H88L84 38H30Z" fill="#F5A86C" stroke="#E8530E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Box lid handle -->
  <rect x="48" y="34" width="18" height="8" rx="4" fill="#FFF8F0" stroke="#E8530E" stroke-width="2" stroke-linecap="round"/>
  <!-- Box label/sticker -->
  <rect x="42" y="56" width="30" height="18" rx="4" fill="#FFFFFF" stroke="#FDDCB5" stroke-width="1.5"/>
  <!-- Label lines -->
  <line x1="47" y1="62" x2="67" y2="62" stroke="#F5D4B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="47" y1="68" x2="60" y2="68" stroke="#F5D4B8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Items peeking out -->
  <circle cx="38" cy="44" r="5" fill="#FFD97A" stroke="#D4880A" stroke-width="1.5"/>
  <rect x="68" y="40" width="8" height="12" rx="3" fill="#7BC47F" stroke="#3D9142" stroke-width="1.5"/>
  <!-- Small bottle peeking -->
  <rect x="78" y="42" width="6" height="10" rx="3" fill="#A8D8F0" stroke="#5BA3C9" stroke-width="1.5"/>
  <rect x="79.5" y="39" width="3" height="4" rx="1.5" fill="#A8D8F0" stroke="#5BA3C9" stroke-width="1"/>
  <!-- Sparkle -->
  <path d="M92 54L94 50L96 54L94 58Z" fill="#E8530E" opacity="0.5"/>
  <path d="M22 62L24 59L26 62L24 65Z" fill="#F5A86C" opacity="0.6"/>
</svg>
